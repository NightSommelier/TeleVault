<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TeleDrive Vault</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fa;
      --panel: #ffffff;
      --ink: #1b1f24;
      --muted: #68707c;
      --line: #d9dee7;
      --primary: #0f766e;
      --primary-ink: #ffffff;
      --danger: #b42318;
      --warn: #a15c07;
      --ok: #167f3b;
      --soft: #eef6f5;
      --shadow: 0 1px 2px rgba(16, 24, 40, .06);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    button, input, select { font: inherit; }
    button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      min-height: 36px;
      padding: 0 12px;
      border-radius: 6px;
      cursor: pointer;
    }
    button.primary {
      border-color: var(--primary);
      background: var(--primary);
      color: var(--primary-ink);
    }
    button.link {
      border: 0;
      background: transparent;
      color: var(--primary);
      min-height: 28px;
      padding: 0 2px;
    }
    button:disabled { opacity: .55; cursor: not-allowed; }
    input[type="file"] { max-width: 100%; }
    input[type="file"].hidden-input {
      width: 1px;
      height: 1px;
      opacity: 0;
      position: absolute;
      pointer-events: none;
    }
    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .mark {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      background: var(--primary);
      display: grid;
      place-items: center;
      color: white;
      font-weight: 700;
    }
    h1 { font-size: 17px; margin: 0; font-weight: 650; }
    .userbar { display: flex; align-items: center; gap: 10px; color: var(--muted); min-width: 0; }
    main {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      min-height: 0;
    }
    aside {
      border-right: 1px solid var(--line);
      background: #fbfcfe;
      padding: 16px;
    }
    section { padding: 18px; min-width: 0; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }
    .panel + .panel { margin-top: 14px; }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }
    .panel-title { font-weight: 650; }
    .panel-body { padding: 14px; }
    .muted { color: var(--muted); }
    .hidden { display: none !important; }
    .qr {
      width: min(260px, 100%);
      aspect-ratio: 1;
      image-rendering: pixelated;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
    }
    .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .row-actions { justify-content: flex-end; }
    .segmented {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      background: var(--panel);
    }
    .segmented button {
      border: 0;
      border-radius: 0;
      min-height: 34px;
    }
    .segmented button.active {
      background: var(--primary);
      color: var(--primary-ink);
    }
    .stack { display: grid; gap: 12px; }
    .field { display: grid; gap: 6px; }
    .field label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }
    .field input[type="text"],
    .field input[type="number"],
    .field input[type="password"],
    .copy-field input[type="text"],
    .field select {
      width: 100%;
      min-height: 36px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--ink);
    }
    .field-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 180px;
      gap: 10px;
      align-items: end;
    }
    .crumbs {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      color: var(--muted);
      flex-wrap: wrap;
    }
    .crumbs span {
      color: var(--muted);
    }
    .folder-name {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .folder-mark {
      width: 24px;
      height: 18px;
      border: 1px solid #c59d2f;
      border-radius: 3px;
      background: #f3cf66;
      position: relative;
      flex: 0 0 auto;
    }
    .folder-mark::before {
      content: "";
      position: absolute;
      left: 2px;
      top: -5px;
      width: 10px;
      height: 5px;
      border: 1px solid #c59d2f;
      border-bottom: 0;
      border-radius: 3px 3px 0 0;
      background: #f3cf66;
    }
    .status {
      min-height: 20px;
      color: var(--muted);
      overflow-wrap: anywhere;
    }
    .status.error { color: var(--danger); }
    .dropzone {
      display: grid;
      place-items: center;
      min-height: 120px;
      padding: 18px;
      border: 1px dashed #9aa6b2;
      border-radius: 8px;
      background: #fbfcfe;
      color: var(--muted);
      text-align: center;
      cursor: pointer;
    }
    .dropzone.dragging {
      border-color: var(--primary);
      background: var(--soft);
      color: var(--primary);
    }
    .table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    .table th, .table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
      overflow-wrap: anywhere;
    }
    .table th {
      font-size: 12px;
      color: var(--muted);
      font-weight: 650;
      background: #fbfcfe;
    }
    .table tr:last-child td { border-bottom: 0; }
    .compact-table th, .compact-table td {
      padding: 8px 10px;
    }
    .subhead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-top: 6px;
      border-top: 1px solid var(--line);
    }
    .copy-field {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      background: #eef2f6;
      color: #3d4652;
      font-size: 12px;
      white-space: nowrap;
    }
    .badge.ok { background: #e7f6ed; color: var(--ok); }
    .badge.warn { background: #fff3df; color: var(--warn); }
    .badge.error { background: #ffe9e7; color: var(--danger); }
    progress {
      width: 100%;
      height: 10px;
      accent-color: var(--primary);
    }
    .upload-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }
    .login-view {
      display: grid;
      place-items: center;
      min-height: calc(100vh - 60px);
      padding: 20px;
    }
    .login-box {
      width: min(420px, 100%);
      padding: 18px;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(16, 24, 40, .36);
    }
    .modal {
      width: min(620px, 100%);
      max-height: min(760px, calc(100vh - 36px));
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 18px 40px rgba(16, 24, 40, .18);
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }
    .modal-body {
      padding: 16px;
    }
    @media (max-width: 760px) {
      main { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); }
      header { align-items: flex-start; }
      .userbar { flex-direction: column; align-items: flex-end; }
      .table th:nth-child(3), .table td:nth-child(3) { display: none; }
      .field-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">
        <div class="mark">TV</div>
        <h1>TeleDrive Vault</h1>
      </div>
      <div id="userbar" class="userbar hidden">
        <span id="userName"></span>
        <button id="logoutBtn">Log out</button>
      </div>
    </header>

    <div id="loginView" class="login-view">
      <div class="panel login-box">
        <div class="panel-head">
          <div class="panel-title">Telegram sign in</div>
          <button id="startQrBtn" class="primary">Start QR</button>
        </div>
        <div class="panel-body stack">
          <img id="qrImage" class="qr hidden" alt="Telegram login QR code">
          <div id="loginStatus" class="status">Not signed in.</div>
        </div>
      </div>
    </div>

    <main id="appView" class="hidden">
      <aside>
        <div class="panel">
          <div class="panel-head">
            <div class="panel-title">Upload</div>
          </div>
          <div class="panel-body stack">
            <div class="field">
              <label for="folderNameInput">Folder</label>
              <div class="actions">
                <input id="folderNameInput" type="text" maxlength="255" placeholder="New folder">
                <button id="createFolderBtn">Create</button>
              </div>
            </div>
            <div id="dropZone" class="dropzone" tabindex="0">Drop file here or click to choose</div>
            <input id="fileInput" class="hidden-input" type="file">
            <button id="uploadBtn" class="primary">Upload</button>
            <div id="uploadStatus" class="status"></div>
            <progress id="uploadProgress" value="0" max="100"></progress>
          </div>
        </div>
      </aside>

      <section>
        <div class="panel">
          <div class="panel-head">
            <div class="stack">
              <div class="panel-title">Files</div>
              <div id="breadcrumbs" class="crumbs"></div>
            </div>
            <div class="actions">
              <div class="segmented" role="group" aria-label="File view">
                <button id="ownFilesBtn" class="active">Own</button>
                <button id="sharedFilesBtn">Shared</button>
              </div>
              <button id="upBtn">Up</button>
              <button id="refreshBtn">Refresh</button>
            </div>
          </div>
          <div class="panel-body">
            <table class="table">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Status</th>
                  <th>Size</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="filesBody">
                <tr><td colspan="4" class="muted">No files loaded.</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <div id="shareModal" class="modal-backdrop hidden">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="shareTitle">
        <div class="modal-head">
          <div>
            <div id="shareTitle" class="panel-title">Share file</div>
            <div id="shareFileName" class="muted"></div>
          </div>
          <button id="closeShareBtn">Close</button>
        </div>
        <div class="modal-body stack">
          <div class="field-row">
            <div class="field">
              <label for="shareTelegramInput">Telegram ID</label>
              <input id="shareTelegramInput" type="number" min="1" step="1" placeholder="123456789">
            </div>
            <div class="field">
              <label for="shareExpirySelect">Access</label>
              <select id="shareExpirySelect">
                <option value="">No limit</option>
                <option value="1h">1 hour</option>
                <option value="1d">1 day</option>
                <option value="7d">7 days</option>
              </select>
            </div>
          </div>
          <div class="actions">
            <button id="createShareBtn" class="primary">Share</button>
          </div>
          <div id="shareStatus" class="status"></div>
          <table class="table compact-table">
            <thead>
              <tr>
                <th>User</th>
                <th>Expires</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="sharesBody">
              <tr><td colspan="3" class="muted">No active shares.</td></tr>
            </tbody>
          </table>
          <div class="subhead">
            <div>
              <div class="panel-title">Public links</div>
              <div class="muted">Anyone with the link can download until it expires or is revoked.</div>
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label for="publicExpirySelect">Access</label>
              <select id="publicExpirySelect">
                <option value="1h">1 hour</option>
                <option value="1d" selected>1 day</option>
                <option value="7d">7 days</option>
                <option value="">No limit</option>
              </select>
            </div>
            <div class="actions">
              <button id="createPublicLinkBtn" class="primary">Create link</button>
            </div>
          </div>
          <div class="field">
            <label for="publicPasswordInput">Password</label>
            <input id="publicPasswordInput" type="password" minlength="8" maxlength="1024" autocomplete="new-password" placeholder="Optional, at least 8 characters">
          </div>
          <div id="publicLinkResult" class="copy-field hidden">
            <input id="publicLinkInput" type="text" readonly>
            <button id="copyPublicLinkBtn">Copy</button>
          </div>
          <table class="table compact-table">
            <thead>
              <tr>
                <th>Created</th>
                <th>Expires</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="publicLinksBody">
              <tr><td colspan="3" class="muted">No active public links.</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const state = {
      user: null,
      qrLoginId: null,
      qrTimer: null,
      uploadTimer: null,
      currentFolderId: '',
      folderStack: [],
      view: 'own',
      droppedFile: null,
      shareFile: null,
      applyingRoute: false,
    };

    const el = {
      loginView: document.getElementById('loginView'),
      appView: document.getElementById('appView'),
      userbar: document.getElementById('userbar'),
      userName: document.getElementById('userName'),
      startQrBtn: document.getElementById('startQrBtn'),
      qrImage: document.getElementById('qrImage'),
      loginStatus: document.getElementById('loginStatus'),
      logoutBtn: document.getElementById('logoutBtn'),
      refreshBtn: document.getElementById('refreshBtn'),
      ownFilesBtn: document.getElementById('ownFilesBtn'),
      sharedFilesBtn: document.getElementById('sharedFilesBtn'),
      upBtn: document.getElementById('upBtn'),
      breadcrumbs: document.getElementById('breadcrumbs'),
      filesBody: document.getElementById('filesBody'),
      folderNameInput: document.getElementById('folderNameInput'),
      createFolderBtn: document.getElementById('createFolderBtn'),
      dropZone: document.getElementById('dropZone'),
      fileInput: document.getElementById('fileInput'),
      uploadBtn: document.getElementById('uploadBtn'),
      uploadStatus: document.getElementById('uploadStatus'),
      uploadProgress: document.getElementById('uploadProgress'),
      shareModal: document.getElementById('shareModal'),
      closeShareBtn: document.getElementById('closeShareBtn'),
      shareFileName: document.getElementById('shareFileName'),
      shareTelegramInput: document.getElementById('shareTelegramInput'),
      shareExpirySelect: document.getElementById('shareExpirySelect'),
      createShareBtn: document.getElementById('createShareBtn'),
      shareStatus: document.getElementById('shareStatus'),
      sharesBody: document.getElementById('sharesBody'),
      publicExpirySelect: document.getElementById('publicExpirySelect'),
      createPublicLinkBtn: document.getElementById('createPublicLinkBtn'),
      publicLinkResult: document.getElementById('publicLinkResult'),
      publicLinkInput: document.getElementById('publicLinkInput'),
      publicPasswordInput: document.getElementById('publicPasswordInput'),
      copyPublicLinkBtn: document.getElementById('copyPublicLinkBtn'),
      publicLinksBody: document.getElementById('publicLinksBody'),
    };

    function csrfToken() {
      const found = document.cookie.split('; ').find((entry) => entry.startsWith('td_csrf='));
      return found ? decodeURIComponent(found.slice('td_csrf='.length)) : '';
    }

    async function api(path, options = {}) {
      const headers = new Headers(options.headers || {});
      if (options.body && !(options.body instanceof Blob) && !headers.has('Content-Type')) {
        headers.set('Content-Type', 'application/json');
      }
      if (options.csrf) headers.set('X-CSRF-Token', csrfToken());
      const response = await fetch(path, {
        ...options,
        headers,
        credentials: 'same-origin',
      });
      if (!response.ok) {
        let message = response.statusText;
        try {
          const body = await response.json();
          message = body.error || message;
        } catch (_) {}
        throw new Error(message);
      }
      if (response.status === 204) return null;
      return response.json();
    }

    function showApp(user) {
      state.user = user;
      el.loginView.classList.add('hidden');
      el.appView.classList.remove('hidden');
      el.userbar.classList.remove('hidden');
      el.userName.textContent = user.displayName || user.username || `Telegram ${user.telegram_id}`;
      restoreFolderState();
      if (!window.location.hash) window.location.hash = state.currentFolderId ? folderRoute(state.currentFolderId) : '#/';
      applyRoute();
    }

    function showLogin(message) {
      state.user = null;
      state.currentFolderId = '';
      state.folderStack = [];
      state.view = 'own';
      state.droppedFile = null;
      state.shareFile = null;
      el.loginView.classList.remove('hidden');
      el.appView.classList.add('hidden');
      el.userbar.classList.add('hidden');
      el.loginStatus.textContent = message || 'Not signed in.';
    }

    async function loadMe() {
      try {
        const data = await api('/me');
        showApp(data.user);
      } catch (_) {
        showLogin();
      }
    }

    async function startQR() {
      clearInterval(state.qrTimer);
      el.startQrBtn.disabled = true;
      el.loginStatus.classList.remove('error');
      el.loginStatus.textContent = 'Starting...';
      try {
        const data = await api('/auth/telegram/qr/start', { method: 'POST' });
        updateQR(data.qr_login);
        state.qrTimer = setInterval(pollQR, 2000);
      } catch (err) {
        el.loginStatus.classList.add('error');
        el.loginStatus.textContent = err.message;
      } finally {
        el.startQrBtn.disabled = false;
      }
    }

    function updateQR(qr) {
      state.qrLoginId = qr.id;
      if (qr.qr_image_url) {
        el.qrImage.src = qr.qr_image_url;
        el.qrImage.classList.remove('hidden');
      }
      el.loginStatus.textContent = `Expires ${new Date(qr.expires_at).toLocaleTimeString()}`;
    }

    async function pollQR() {
      if (!state.qrLoginId) return;
      try {
        const data = await api('/auth/telegram/qr/complete', {
          method: 'POST',
          body: JSON.stringify({ qr_login_id: state.qrLoginId }),
        });
        if (data.status === 'pending') {
          updateQR(data.qr_login);
          return;
        }
        clearInterval(state.qrTimer);
        el.qrImage.classList.add('hidden');
        showApp(data.user);
      } catch (err) {
        clearInterval(state.qrTimer);
        el.loginStatus.classList.add('error');
        el.loginStatus.textContent = err.message;
      }
    }

    async function logout() {
      await api('/auth/logout', { method: 'POST', csrf: true });
      showLogin('Signed out.');
    }

    async function refreshFiles() {
      el.filesBody.innerHTML = `<tr><td colspan="4" class="muted">Loading...</td></tr>`;
      renderBreadcrumbs();
      try {
        const data = state.view === 'shared'
          ? await api('/shared')
          : await api(`/files${state.currentFolderId ? `?parent_id=${encodeURIComponent(state.currentFolderId)}` : ''}`);
        renderFiles(data.files || []);
      } catch (err) {
        el.filesBody.innerHTML = `<tr><td colspan="4" class="muted">${escapeHTML(err.message)}</td></tr>`;
      }
    }

    function renderFiles(files) {
      if (!files.length) {
        const message = state.view === 'shared' ? 'No shared files.' : 'No files in this folder.';
        el.filesBody.innerHTML = `<tr><td colspan="4" class="muted">${message}</td></tr>`;
        return;
      }
      el.filesBody.innerHTML = files.map((file) => `
        <tr>
          <td>${renderFileName(file)}</td>
          <td><span class="badge ${file.status === 'ready' ? 'ok' : 'warn'}">${escapeHTML(file.status)}</span></td>
          <td>${file.type === 'folder' ? '-' : formatBytes(file.plaintext_size || 0)}</td>
          <td><div class="actions row-actions">${renderFileActions(file)}</div></td>
        </tr>
      `).join('');
      el.filesBody.querySelectorAll('[data-open-folder]').forEach((button) => {
        button.addEventListener('click', () => {
          const folder = files.find((file) => file.id === button.dataset.openFolder);
          navigateToFolder(folder);
        });
      });
      el.filesBody.querySelectorAll('[data-download]').forEach((button) => {
        button.addEventListener('click', () => {
          window.location.href = `/files/${button.dataset.download}/download`;
        });
      });
      el.filesBody.querySelectorAll('[data-delete]').forEach((button) => {
        button.addEventListener('click', () => deleteFile(button.dataset.delete));
      });
      el.filesBody.querySelectorAll('[data-share]').forEach((button) => {
        button.addEventListener('click', () => {
          const file = files.find((item) => item.id === button.dataset.share);
          openShareDialog(file);
        });
      });
    }

    function renderFileActions(file) {
      if (state.view === 'shared') {
        return `<button data-download="${file.id}">Download</button>`;
      }
      const deleteButton = `<button data-delete="${file.id}">Delete</button>`;
      if (file.type === 'folder') {
        return `<button data-open-folder="${file.id}">Open</button>${deleteButton}`;
      }
      return `<button data-download="${file.id}">Download</button><button data-share="${file.id}">Share</button>${deleteButton}`;
    }

    function renderFileName(file) {
      const name = escapeHTML(file.name || 'Untitled');
      if (file.type !== 'folder') return name;
      return `<button class="link folder-name" data-open-folder="${file.id}"><span class="folder-mark" aria-hidden="true"></span>${name}</button>`;
    }

    function renderBreadcrumbs() {
      const root = `<button class="link" data-crumb-index="-1">Root</button>`;
      const crumbs = state.folderStack.map((folder, index) => (
        `<span>/</span><button class="link" data-crumb-index="${index}">${escapeHTML(folder.name || 'Untitled')}</button>`
      )).join('');
      el.breadcrumbs.innerHTML = state.view === 'shared' ? '<span>Shared with me</span>' : root + crumbs;
      el.upBtn.disabled = state.view === 'shared' || !state.currentFolderId;
      el.ownFilesBtn.classList.toggle('active', state.view === 'own');
      el.sharedFilesBtn.classList.toggle('active', state.view === 'shared');
      el.breadcrumbs.querySelectorAll('[data-crumb-index]').forEach((button) => {
        button.addEventListener('click', () => jumpToCrumb(Number(button.dataset.crumbIndex)));
      });
    }

    function navigateToFolder(folder) {
      if (!folder || folder.type !== 'folder') return;
      state.currentFolderId = folder.id;
      state.folderStack.push({ id: folder.id, name: folder.name || 'Untitled' });
      saveFolderState();
      setHashRoute(folderRoute(folder.id));
    }

    function openFolder(folder) {
      if (!folder || folder.type !== 'folder') return;
      state.currentFolderId = folder.id;
      state.folderStack.push({ id: folder.id, name: folder.name || 'Untitled' });
      saveFolderState();
      refreshFiles();
    }

    function goUp() {
      if (!state.currentFolderId) return;
      state.folderStack.pop();
      const parent = state.folderStack[state.folderStack.length - 1];
      state.currentFolderId = parent ? parent.id : '';
      saveFolderState();
      setHashRoute(parent ? folderRoute(parent.id) : '#/');
    }

    function jumpToCrumb(index) {
      if (index < 0) {
        state.folderStack = [];
        state.currentFolderId = '';
      } else {
        state.folderStack = state.folderStack.slice(0, index + 1);
        state.currentFolderId = state.folderStack[index].id;
      }
      saveFolderState();
      setHashRoute(state.currentFolderId ? folderRoute(state.currentFolderId) : '#/');
    }

    function setView(view) {
      state.view = view;
      state.droppedFile = null;
      setHashRoute(view === 'shared' ? '#/shared' : (state.currentFolderId ? folderRoute(state.currentFolderId) : '#/'));
    }

    function setHashRoute(hash) {
      if (window.location.hash === hash) {
        applyRoute();
        return;
      }
      window.location.hash = hash;
    }

    function folderRoute(id) {
      return `#/folder/${encodeURIComponent(id)}`;
    }

    async function applyRoute() {
      if (!state.user || state.applyingRoute) return;
      state.applyingRoute = true;
      try {
        const route = parseHashRoute();
        if (route.view === 'shared') {
          state.view = 'shared';
          state.droppedFile = null;
          renderBreadcrumbs();
          await refreshFiles();
          return;
        }

        state.view = 'own';
        state.droppedFile = null;
        if (!route.folderId) {
          state.currentFolderId = '';
          state.folderStack = [];
          saveFolderState();
          renderBreadcrumbs();
          await refreshFiles();
          return;
        }

        try {
          await loadFolderRoute(route.folderId);
        } catch (err) {
          state.currentFolderId = '';
          state.folderStack = [];
          saveFolderState();
          if (window.location.hash !== '#/') {
            window.location.hash = '#/';
            return;
          }
          setUploadStatus(err.message, true);
        }
        saveFolderState();
        renderBreadcrumbs();
        await refreshFiles();
      } finally {
        state.applyingRoute = false;
      }
    }

    function parseHashRoute() {
      const hash = window.location.hash || '#/';
      if (hash === '#/shared') return { view: 'shared' };
      const match = hash.match(/^#\/folder\/([^/]+)$/);
      if (match) return { view: 'own', folderId: decodeURIComponent(match[1]) };
      return { view: 'own', folderId: '' };
    }

    async function loadFolderRoute(folderId) {
      const stack = [];
      let currentID = folderId;
      const seen = new Set();
      while (currentID) {
        if (seen.has(currentID)) throw new Error('folder_cycle');
        seen.add(currentID);
        const data = await api(`/files/${encodeURIComponent(currentID)}`);
        const folder = data.file;
        if (!folder || folder.type !== 'folder') throw new Error('folder_not_found');
        stack.unshift({ id: folder.id, name: folder.name || 'Untitled' });
        currentID = folder.parent_id || '';
      }
      state.currentFolderId = folderId;
      state.folderStack = stack;
    }

    async function createFolder() {
      const name = el.folderNameInput.value.trim();
      if (!name) return;
      el.createFolderBtn.disabled = true;
      try {
        await api('/folders', {
          method: 'POST',
          csrf: true,
          body: JSON.stringify({
            name,
            parent_id: state.currentFolderId || undefined,
          }),
        });
        el.folderNameInput.value = '';
        await refreshFiles();
      } catch (err) {
        setUploadStatus(err.message, true);
      } finally {
        el.createFolderBtn.disabled = false;
      }
    }

    async function deleteFile(id) {
      if (!id || !window.confirm('Delete this item?')) return;
      try {
        await api(`/files/${id}`, { method: 'DELETE', csrf: true });
        await refreshFiles();
      } catch (err) {
        setUploadStatus(err.message, true);
      }
    }

    async function openShareDialog(file) {
      if (!file) return;
      state.shareFile = file;
      el.shareFileName.textContent = file.name || 'Untitled';
      el.shareTelegramInput.value = '';
      el.shareExpirySelect.value = '';
      el.publicExpirySelect.value = '1d';
      el.publicLinkInput.value = '';
      el.publicPasswordInput.value = '';
      el.publicLinkResult.classList.add('hidden');
      setShareStatus('');
      el.shareModal.classList.remove('hidden');
      await refreshShares();
      await refreshPublicLinks();
      el.shareTelegramInput.focus();
    }

    function closeShareDialog() {
      state.shareFile = null;
      el.shareModal.classList.add('hidden');
    }

    async function refreshShares() {
      if (!state.shareFile) return;
      el.sharesBody.innerHTML = `<tr><td colspan="3" class="muted">Loading...</td></tr>`;
      try {
        const data = await api(`/files/${state.shareFile.id}/shares`);
        renderShares(data.shares || []);
      } catch (err) {
        el.sharesBody.innerHTML = `<tr><td colspan="3" class="muted">${escapeHTML(err.message)}</td></tr>`;
      }
    }

    async function refreshPublicLinks() {
      if (!state.shareFile) return;
      el.publicLinksBody.innerHTML = `<tr><td colspan="3" class="muted">Loading...</td></tr>`;
      try {
        const data = await api(`/files/${state.shareFile.id}/public-links`);
        renderPublicLinks(data.public_links || []);
      } catch (err) {
        el.publicLinksBody.innerHTML = `<tr><td colspan="3" class="muted">${escapeHTML(err.message)}</td></tr>`;
      }
    }

    function renderShares(shares) {
      if (!shares.length) {
        el.sharesBody.innerHTML = `<tr><td colspan="3" class="muted">No active shares.</td></tr>`;
        return;
      }
      el.sharesBody.innerHTML = shares.map((share) => `
        <tr>
          <td>${escapeHTML(share.grantee_username || share.grantee_name || `Telegram ${share.grantee_telegram_id}`)}</td>
          <td>${share.expires_at ? escapeHTML(new Date(share.expires_at).toLocaleString()) : 'No limit'}</td>
          <td><button data-revoke-share="${share.id}">Revoke</button></td>
        </tr>
      `).join('');
      el.sharesBody.querySelectorAll('[data-revoke-share]').forEach((button) => {
        button.addEventListener('click', () => revokeShare(button.dataset.revokeShare));
      });
    }

    async function createShare() {
      if (!state.shareFile) return;
      const telegramID = Number(el.shareTelegramInput.value);
      if (!Number.isInteger(telegramID) || telegramID <= 0) {
        setShareStatus('telegram_id_required', true);
        return;
      }
      try {
        el.createShareBtn.disabled = true;
        await api(`/files/${state.shareFile.id}/shares`, {
          method: 'POST',
          csrf: true,
          body: JSON.stringify({
            telegram_id: telegramID,
            expires_at: selectedShareExpiry(),
          }),
        });
        el.shareTelegramInput.value = '';
        el.shareExpirySelect.value = '';
        setShareStatus('Share created.');
        await refreshShares();
      } catch (err) {
        setShareStatus(err.message, true);
      } finally {
        el.createShareBtn.disabled = false;
      }
    }

    async function revokeShare(shareID) {
      if (!state.shareFile || !shareID) return;
      try {
        await api(`/files/${state.shareFile.id}/shares/${shareID}`, { method: 'DELETE', csrf: true });
        setShareStatus('Share revoked.');
        await refreshShares();
      } catch (err) {
        setShareStatus(err.message, true);
      }
    }

    async function createPublicLink() {
      if (!state.shareFile) return;
      try {
        el.createPublicLinkBtn.disabled = true;
        const data = await api(`/files/${state.shareFile.id}/public-links`, {
          method: 'POST',
          csrf: true,
          body: JSON.stringify({
            expires_at: selectedExpiry(el.publicExpirySelect.value),
            password: el.publicPasswordInput.value.trim() || undefined,
          }),
        });
        el.publicLinkInput.value = data.url || '';
        el.publicPasswordInput.value = '';
        el.publicLinkResult.classList.remove('hidden');
        setShareStatus('Public link created.');
        await refreshPublicLinks();
      } catch (err) {
        setShareStatus(err.message, true);
      } finally {
        el.createPublicLinkBtn.disabled = false;
      }
    }

    function renderPublicLinks(links) {
      if (!links.length) {
        el.publicLinksBody.innerHTML = `<tr><td colspan="3" class="muted">No active public links.</td></tr>`;
        return;
      }
      el.publicLinksBody.innerHTML = links.map((link) => `
        <tr>
          <td>${escapeHTML(new Date(link.created_at).toLocaleString())}</td>
          <td>${link.expires_at ? escapeHTML(new Date(link.expires_at).toLocaleString()) : 'No limit'}${link.password_required ? ' + password' : ''}</td>
          <td><button data-revoke-public-link="${link.id}">Revoke</button></td>
        </tr>
      `).join('');
      el.publicLinksBody.querySelectorAll('[data-revoke-public-link]').forEach((button) => {
        button.addEventListener('click', () => revokePublicLink(button.dataset.revokePublicLink));
      });
    }

    async function revokePublicLink(linkID) {
      if (!state.shareFile || !linkID) return;
      try {
        await api(`/files/${state.shareFile.id}/public-links/${linkID}`, { method: 'DELETE', csrf: true });
        setShareStatus('Public link revoked.');
        await refreshPublicLinks();
      } catch (err) {
        setShareStatus(err.message, true);
      }
    }

    async function copyPublicLink() {
      if (!el.publicLinkInput.value) return;
      try {
        await navigator.clipboard.writeText(el.publicLinkInput.value);
        setShareStatus('Public link copied.');
      } catch (_) {
        el.publicLinkInput.focus();
        el.publicLinkInput.select();
        setShareStatus('Select the link and copy it.');
      }
    }

    function selectedShareExpiry() {
      return selectedExpiry(el.shareExpirySelect.value);
    }

    function selectedExpiry(value) {
      if (!value) return undefined;
      const date = new Date();
      if (value === '1h') date.setHours(date.getHours() + 1);
      if (value === '1d') date.setDate(date.getDate() + 1);
      if (value === '7d') date.setDate(date.getDate() + 7);
      return date.toISOString();
    }

    function setShareStatus(message, error = false) {
      el.shareStatus.textContent = message;
      el.shareStatus.classList.toggle('error', error);
    }

    async function uploadSelected() {
      const file = state.droppedFile || el.fileInput.files[0];
      if (!file) return;
      if (state.view !== 'own') {
        setUploadStatus('Switch to Own files to upload.', true);
        return;
      }
      el.uploadBtn.disabled = true;
      el.uploadProgress.value = 0;
      setUploadStatus('Hashing file...');
      try {
        const checksum = await sha256Hex(file);
        const created = await api('/uploads', {
          method: 'POST',
          csrf: true,
          body: JSON.stringify({
            name: file.name,
            parent_id: state.currentFolderId || undefined,
            mime_type: file.type || 'application/octet-stream',
            plaintext_size: file.size,
            checksum,
          }),
        });
        await uploadParts(created.upload, file);
        await waitUntilReady(created.upload.id);
        await api(`/uploads/${created.upload.id}/complete`, { method: 'POST', csrf: true });
        setUploadStatus('Upload complete.');
        el.uploadProgress.value = 100;
        el.fileInput.value = '';
        state.droppedFile = null;
        updateDropZone();
        await refreshFiles();
      } catch (err) {
        setUploadStatus(err.message, true);
      } finally {
        el.uploadBtn.disabled = false;
      }
    }

    function updateDropZone() {
      const file = state.droppedFile || el.fileInput.files[0];
      el.dropZone.textContent = file ? file.name : 'Drop file here or click to choose';
    }

    function saveFolderState() {
      localStorage.setItem('tdv.folderState', JSON.stringify({
        currentFolderId: state.currentFolderId,
        folderStack: state.folderStack,
      }));
    }

    function restoreFolderState() {
      try {
        const saved = JSON.parse(localStorage.getItem('tdv.folderState') || '{}');
        state.currentFolderId = typeof saved.currentFolderId === 'string' ? saved.currentFolderId : '';
        state.folderStack = Array.isArray(saved.folderStack) ? saved.folderStack.filter((folder) => (
          folder && typeof folder.id === 'string' && typeof folder.name === 'string'
        )) : [];
      } catch (_) {
        state.currentFolderId = '';
        state.folderStack = [];
      }
    }

    async function uploadParts(upload, file) {
      const partSize = upload.part_size;
      const count = upload.part_count;
      for (let part = 1; part <= count; part++) {
        const start = (part - 1) * partSize;
        const end = Math.min(start + partSize, file.size);
        setUploadStatus(`Staging part ${part} of ${count}...`);
        const response = await fetch(`/uploads/${upload.id}/parts/${part}`, {
          method: 'POST',
          credentials: 'same-origin',
          headers: {
            'Content-Type': 'application/octet-stream',
            'X-CSRF-Token': csrfToken(),
          },
          body: file.slice(start, end),
        });
        if (!response.ok && response.status !== 202) {
          let message = response.statusText;
          try {
            const body = await response.json();
            message = body.error || message;
          } catch (_) {}
          throw new Error(message);
        }
        el.uploadProgress.value = Math.round((part / count) * 50);
      }
    }

    async function waitUntilReady(uploadID) {
      clearInterval(state.uploadTimer);
      while (true) {
        const data = await api(`/uploads/${uploadID}`);
        const progress = data.progress;
        const done = progress.complete_parts;
        const total = progress.expected_parts;
        const queued = progress.queued_parts;
        const leased = progress.leased_parts;
        if (progress.failed_parts > 0) throw new Error('upload_part_failed');
        if (progress.ready_to_complete) return;
        setUploadStatus(`Telegram drain: ${done}/${total} complete, ${leased} active, ${queued} queued`);
        el.uploadProgress.value = 50 + Math.round((done / Math.max(total, 1)) * 45);
        await delay(2000);
      }
    }

    function setUploadStatus(message, error = false) {
      el.uploadStatus.textContent = message;
      el.uploadStatus.classList.toggle('error', error);
    }

    async function sha256Hex(file) {
      const digest = await crypto.subtle.digest('SHA-256', await file.arrayBuffer());
      return Array.from(new Uint8Array(digest)).map((byte) => byte.toString(16).padStart(2, '0')).join('');
    }

    function formatBytes(bytes) {
      if (!bytes) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      const index = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
      return `${(bytes / Math.pow(1024, index)).toFixed(index ? 1 : 0)} ${units[index]}`;
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[char]));
    }

    function delay(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    el.startQrBtn.addEventListener('click', startQR);
    el.logoutBtn.addEventListener('click', logout);
    el.refreshBtn.addEventListener('click', refreshFiles);
    el.ownFilesBtn.addEventListener('click', () => setView('own'));
    el.sharedFilesBtn.addEventListener('click', () => setView('shared'));
    el.upBtn.addEventListener('click', goUp);
    el.createFolderBtn.addEventListener('click', createFolder);
    el.folderNameInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') createFolder();
    });
    el.dropZone.addEventListener('click', () => el.fileInput.click());
    el.dropZone.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') el.fileInput.click();
    });
    el.fileInput.addEventListener('change', () => {
      state.droppedFile = null;
      updateDropZone();
    });
    el.dropZone.addEventListener('dragover', (event) => {
      event.preventDefault();
      el.dropZone.classList.add('dragging');
    });
    el.dropZone.addEventListener('dragleave', () => {
      el.dropZone.classList.remove('dragging');
    });
    el.dropZone.addEventListener('drop', (event) => {
      event.preventDefault();
      el.dropZone.classList.remove('dragging');
      state.droppedFile = event.dataTransfer.files[0] || null;
      el.fileInput.value = '';
      updateDropZone();
    });
    el.uploadBtn.addEventListener('click', uploadSelected);
    el.closeShareBtn.addEventListener('click', closeShareDialog);
    el.createShareBtn.addEventListener('click', createShare);
    el.createPublicLinkBtn.addEventListener('click', createPublicLink);
    el.copyPublicLinkBtn.addEventListener('click', copyPublicLink);
    el.shareModal.addEventListener('click', (event) => {
      if (event.target === el.shareModal) closeShareDialog();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && !el.shareModal.classList.contains('hidden')) closeShareDialog();
    });
    window.addEventListener('hashchange', applyRoute);
    loadMe();
  </script>
</body>
</html>
