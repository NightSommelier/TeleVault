  <rect x="1012" y="382" width="336" height="56" rx="14" fill="#f7f8fa"/>
  <text x="1034" y="415" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1b1f24">Recovery export</text>
  <rect x="1012" y="452" width="336" height="56" rx="14" fill="#f7f8fa"/>
  <text x="1034" y="485" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1b1f24">Public links</text>
  <rect x="1012" y="522" width="336" height="56" rx="14" fill="#f7f8fa"/>
  <text x="1034" y="555" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1b1f24">Settings</text>
  <text x="1012" y="630" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#68707c">Community is practical and fully usable.</text>
  <text x="1012" y="658" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#68707c">No telemetry by default.</text>
</svg>
