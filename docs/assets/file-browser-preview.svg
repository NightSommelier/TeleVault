<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">TeleVault file browser preview</title>
  <desc id="desc">Illustrative file browser preview with breadcrumb navigation, file rows, and metadata panel.</desc>
  <rect width="1400" height="900" fill="#f6f8fb"/>
  <rect x="0" y="0" width="1400" height="72" fill="#ffffff"/>
  <text x="32" y="42" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1b1f24">File browser</text>
  <text x="32" y="60" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#68707c">Folders, files, checksums, and metadata</text>
  <rect x="24" y="100" width="1352" height="52" rx="14" fill="#ffffff" stroke="#d9dee7"/>
  <text x="48" y="132" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#68707c">Workspace / Archive / 2026 / Photos</text>
  <rect x="24" y="170" width="934" height="694" rx="18" fill="#ffffff" stroke="#d9dee7"/>
  <text x="52" y="214" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1b1f24">Files</text>
  <rect x="52" y="236" width="878" height="42" rx="10" fill="#f7f8fa"/>
  <text x="72" y="262" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1b1f24">folder: receipts</text>
  <text x="720" y="262" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#68707c">folder</text>
  <rect x="52" y="288" width="878" height="42" rx="10" fill="#f7f8fa"/>
  <text x="72" y="314" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1b1f24">budget-2026.xlsx</text>
  <text x="720" y="314" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#68707c">1.8 MB</text>
  <rect x="52" y="340" width="878" height="42" rx="10" fill="#eef6f5"/>
  <text x="72" y="366" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1b1f24">vacation-photos.zip</text>
  <text x="720" y="366" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#68707c">2.4 GB</text>
  <rect x="52" y="392" width="878" height="42" rx="10" fill="#f7f8fa"/>
  <text x="72" y="418" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1b1f24">meeting-notes.pdf</text>
  <text x="720" y="418" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#68707c">18 MB</text>
  <rect x="52" y="444" width="878" height="42" rx="10" fill="#f7f8fa"/>
  <text x="72" y="470" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1b1f24">archive-index.json</text>
  <text x="720" y="470" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#68707c">metadata</text>
  <rect x="52" y="526" width="878" height="286" rx="16" fill="#fbfcfe" stroke="#d9dee7"/>
  <text x="78" y="560" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1b1f24">Selected file details</text>
  <text x="78" y="594" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#68707c">Filename</text>
  <text x="220" y="594" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1b1f24">vacation-photos.zip</text>
  <text x="78" y="628" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#68707c">Checksum</text>
  <text x="220" y="628" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1b1f24">SHA-256 available when enabled</text>
  <text x="78" y="662" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#68707c">Storage</text>
  <text x="220" y="662" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1b1f24">Telegram-backed encrypted artifacts</text>
  <text x="78" y="696" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#68707c">Recovery</text>
  <text x="220" y="696" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1b1f24">Included in encrypted recovery metadata</text>
  <rect x="984" y="170" width="392" height="694" rx="18" fill="#ffffff" stroke="#d9dee7"/>
  <text x="1012" y="214" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1b1f24">Sidebar</text>
  <rect x="1012" y="242" width="336" height="56" rx="14" fill="#eef6f5"/>
