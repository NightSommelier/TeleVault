<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">TeleVault upload flow preview</title>
  <desc id="desc">Illustrative upload flow preview with hashing, staging, and Telegram drain states.</desc>
  <rect width="1400" height="900" fill="#f6f8fb"/>
  <rect x="0" y="0" width="1400" height="72" fill="#ffffff"/>
  <text x="32" y="42" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1b1f24">Upload flow</text>
  <text x="32" y="60" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#68707c">Hashing, staging, then Telegram drain</text>
  <rect x="28" y="104" width="1344" height="320" rx="18" fill="#ffffff" stroke="#d9dee7"/>
  <text x="56" y="148" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1b1f24">Current upload</text>
  <text x="56" y="176" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#68707c">Large file staged locally, then drained to Telegram by the worker.</text>
  <rect x="56" y="212" width="1288" height="56" rx="14" fill="#f7f8fa"/>
  <text x="80" y="245" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1b1f24">1. Hashing</text>
  <rect x="240" y="234" width="980" height="12" rx="6" fill="#d9dee7"/>
  <rect x="240" y="234" width="920" height="12" rx="6" fill="#0f766e"/>
  <text x="1240" y="245" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#68707c">done</text>
  <rect x="56" y="282" width="1288" height="56" rx="14" fill="#eef6f5"/>
  <text x="80" y="315" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1b1f24">2. Staging</text>
  <rect x="240" y="304" width="980" height="12" rx="6" fill="#d9dee7"/>
  <rect x="240" y="304" width="680" height="12" rx="6" fill="#0f766e"/>
  <text x="1240" y="315" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#68707c">green</text>
  <rect x="56" y="352" width="1288" height="56" rx="14" fill="#f7f8fa"/>
  <text x="80" y="385" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1b1f24">3. Telegram drain</text>
  <rect x="240" y="374" width="980" height="12" rx="6" fill="#d9dee7"/>
  <rect x="240" y="374" width="360" height="12" rx="6" fill="#167f3b"/>
  <text x="1240" y="385" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#68707c">active</text>
  <rect x="28" y="456" width="416" height="390" rx="18" fill="#ffffff" stroke="#d9dee7"/>
  <text x="56" y="500" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1b1f24">Queue</text>
  <rect x="56" y="522" width="360" height="58" rx="12" fill="#f7f8fa"/>
  <text x="76" y="555" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1b1f24">movie.mkv</text>
  <text x="300" y="555" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#68707c">staging</text>
  <rect x="56" y="590" width="360" height="58" rx="12" fill="#f7f8fa"/>
  <text x="76" y="623" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1b1f24">archive.tar.gz</text>
  <text x="300" y="623" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#68707c">telegram</text>
  <rect x="56" y="658" width="360" height="58" rx="12" fill="#f7f8fa"/>
  <text x="76" y="691" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1b1f24">notes.pdf</text>
  <text x="300" y="691" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#68707c">complete</text>
  <rect x="472" y="456" width="900" height="390" rx="18" fill="#ffffff" stroke="#d9dee7"/>
  <text x="500" y="500" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1b1f24">Operational detail</text>
  <text x="500" y="532" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#68707c">The browser can leave after staging is green. The worker keeps draining uploads in the background.</text>
  <rect x="500" y="570" width="840" height="72" rx="14" fill="#eef6f5"/>
  <text x="528" y="606" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1b1f24">Browser-tab safe</text>
  <text x="528" y="628" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#68707c">Yes, once staged server-side</text>
  <rect x="500" y="664" width="840" height="72" rx="14" fill="#f7f8fa"/>
  <text x="528" y="700" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1b1f24">Telemetry</text>
  <text x="528" y="722" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#68707c">No telemetry by default</text>
  <rect x="500" y="758" width="840" height="34" rx="10" fill="#0f766e"/>
  <text x="828" y="780" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff">Upload complete when Telegram drain finishes</text>
</svg>
