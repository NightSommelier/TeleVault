services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: televaultvault
      POSTGRES_USER: televaultvault
      POSTGRES_PASSWORD: televaultvault
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U televaultvault -d televaultvault"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    image: televault-vault:latest
    command: ["migrate", "up"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://televaultvault:televaultvault@postgres:5432/televaultvault?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    image: televault-vault:latest
    command: ["api"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://televaultvault:televaultvault@postgres:5432/televaultvault?sslmode=disable
      VALKEY_ADDR: valkey:6379
      UPLOAD_STAGING_DIR: /data/upload-staging
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - app-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/readyz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    build: .
    image: televault-vault:latest
    command: ["worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://televaultvault:televaultvault@postgres:5432/televaultvault?sslmode=disable
      VALKEY_ADDR: valkey:6379
      UPLOAD_STAGING_DIR: /data/upload-staging
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    volumes:
      - app-data:/data
    restart: unless-stopped

  cleanup:
    build: .
    image: televault-vault:latest
    command:
      - sh
      - -c
      - while true; do cleanup; sleep "$${CLEANUP_INTERVAL_SECONDS:-300}"; done
    env_file: .env
    environment:
      DATABASE_URL: postgres://televaultvault:televaultvault@postgres:5432/televaultvault?sslmode=disable
      VALKEY_ADDR: valkey:6379
      UPLOAD_STAGING_DIR: /data/upload-staging
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    volumes:
      - app-data:/data
    restart: unless-stopped

volumes:
  app-data:
  postgres-data:
  valkey-data:
